# =============================================
# TVK Technologies Portal - Spring Boot Config
# =============================================

# Server port (Spring Boot default)
server.port=8080

# ---- MySQL Database Configuration ----
# IMPORTANT: Update username and password to match your MySQL installation
spring.datasource.url=jdbc:mysql://localhost:3306/tvk_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ---- JPA / Hibernate ----
# 'update' = auto-creates tables on first run, preserves data on restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# ---- Jackson JSON ----
# Exclude null fields from JSON responses (matches Express behavior)
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# ---- SSE / Async ----
# -1 means no timeout (keep SSE connections alive indefinitely)
spring.mvc.async.request-timeout=-1
