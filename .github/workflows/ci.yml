name: TVK Portal CI Pipeline

on:
  push:
    branches: [ main, master, "refactor/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Build & Validate Frontend (Angular 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build

  backend-build:
    name: Build & Test Backend (Spring Boot 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests & Package
        run: mvn clean test -B
